<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset = "UTF-8">
	<meta name = "viewport" content="width=device-width,initial-scale=1.0">
	<title> 温度・湿度　表示 </title>
	<link rel="stylesheet" href="{{ url_for('static', filename = 'browseondo.css')}}">
</head>
<body>

	<main class="container">
		<header class = "title"> 温度・湿度　測定</header>
		
		<section class="card">
		<div class="meta">
			<div class = "date">
			<span id="date">{{date}}</span> &nbsp;
			<span id = "time" class="time">{{jikoku}}</span></div>
		<div class = "reaedings">
		<div class = "reading">温度 : <span id="temp" class = "value">{{ temp }} </span> ℃</div>
		<div class = "reading"> 湿度 : <span id="hum" class="value">{{ hum }}</span> %</div>
		</div>
		</div>
	</section>
	</main>
	
	<script>
	(function(){
		const API = window.location.origin + '/api';
		const STREAM = window.location.origin + '/stream';
		
		function setIf(id, val){
			const el = document.getElementById(id);
			if(!el) return;
			if(val === undefined || val === null || val ==='') {
				el.textContent = '--.-';
				return;
			}

			if (typeof val === 'number') {
                val = val.toFixed(1); 
            } else if (!isNaN(val) && val !== '') {
                val = Number(val).toFixed(1);
            }
			el.textContent = val;
		}
			
		let clientOffsetMs = 0;
		function nowJST(msOffset = 0){
			const d = new Date(Date.now() + msOffset);
			const opts = { timeZone: 'Asia/Tokyo', hour12: false};
			const date = d.toLocaleDateString('ja-JP', opts);
			const time =d.toLocaleTimeString('ja-JP',opts);
			return {date,time};
		}
		function tickClientTime(){
			const t = nowJST(clientOffsetMs);
			setIf('date',t.date.replace(/\//g,'/'));
			setIf('time',t.time);
		}
		async function fetchSensors(){
			try{
				const res = await fetch(API, {cache: 'no-store' });
				if (!res.ok) throw new Error('HTTP ' +res.status);
				const j = await res.json();
				setIf('temp', j.temp);
				setIf('hum',j.hum);
			}catch(e){
				console.error('fetchSensors error',e);
				setIf('temp', null);
				setIf('hum', null);
			}
		}
		fetchSensors();
		tickClientTime();
		setInterval(tickClientTime,1000);
		const eventSource = new EventSource(STREAM);
		
		let errorCount = 0; 

        eventSource.onerror = function(e) {
            errorCount++;
            console.error("Connection error. Retrying... (" + errorCount + "/5)");

            if (errorCount >= 5) {
                console.error("Server appears to be down. Closing connection.");
                eventSource.close(); 
                setIf('temp', null); 
                setIf('hum', null);
            }
        };

        eventSource.onmessage = function(event) {
            try {
                errorCount = 0; 
                const data = JSON.parse(event.data);
                setIf('temp', data.temp);
                setIf('hum', data.hum);
            } catch(e) {
                console.error("SSE data parsing error:", e);
            }
        };
	})();
	</script>
</body>
</html>
